# Absorbed from https://github.com/samschlegel/mc-keygen (upstream commit
# 62ed67f), dual-licensed MIT or Apache-2.0. See ATTRIBUTION.md for what was
# kept, what was removed, and why.

[package]
name = "mc-keygen"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "MeshCore vanity Ed25519 key generator"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
# Umbrella feature implied by any GPU backend. Use for `#[cfg(feature = "gpu")]`
# on code that is relevant to GPU search but not tied to a specific backend.
gpu = []
cuda = ["gpu", "dep:cudarc"]

[dependencies]
# Ed25519 scalar arithmetic and the base-point table the search leans on.
curve25519-dalek = { version = "=5.0.0-pre.6", features = ["precomputed-tables"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CUDA driver bindings. Loaded dynamically at runtime, so building this crate
# needs no CUDA toolkit; the kernel is compiled by NVRTC when a search starts.
cudarc = { version = "0.19", optional = true, features = ["cuda-12040"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
