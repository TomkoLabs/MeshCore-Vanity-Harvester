[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcore-vanity-harvester"
# Deliberately left at 0.0.0 and never bumped. Releases are identified by their
# Git commit (`./run.sh --version`), because a hand-maintained number in a file
# goes stale the moment these sources are copied into another repository.
version = "0.0.0"
description = "Rarity-first CPU/GPU MeshCore vanity identity harvester"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MeshCore Vanity Harvester contributors" }]
dependencies = ["cryptography>=41.0"]
keywords = ["meshcore", "ed25519", "vanity", "cuda", "hexspeak"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]

[project.scripts]
meshcore-vanity-harvester = "meshcore_vanity.cli:main"

[tool.setuptools]
packages = ["meshcore_vanity"]
py-modules = ["meshcore_vanity_harvester"]
